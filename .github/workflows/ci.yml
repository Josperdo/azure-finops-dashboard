name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # actions/setup-python bundles its own baseline pip/setuptools, which can be an old,
      # vulnerable version independent of anything this project declares - pip-audit scans
      # the actual environment, not just our own dependency list, so upgrade it explicitly
      # rather than relying on pyproject.toml's [build-system] requires (which only governs
      # an isolated build sandbox, not this persistent environment). Confirmed by reproducing
      # the CVE locally with an unupgraded pip/setuptools and clearing it with this exact fix.
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: pip-audit
