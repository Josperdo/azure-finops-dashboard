[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-finops-dashboard"
version = "0.1.0"
description = "Azure cost visibility and FinOps audit CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "John Sperry" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "azure-identity>=1.17",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-consumption>=10.0",
    "azure-mgmt-subscription>=3.1",
    "azure-mgmt-resourcegraph>=8.0",
    "azure-mgmt-compute>=31.0",
    "azure-mgmt-network>=25.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[project.scripts]
azure-finops = "azure_finops_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "azure.mgmt.*"
ignore_missing_imports = true
