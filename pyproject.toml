[build-system]
# >=83.0.0: 79.0.1 has a known CVE (PYSEC-2026-3447), caught by CI's pip-audit step.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-finops-dashboard"
version = "0.1.0"
description = "Azure cost visibility and FinOps audit CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "John Sperry" }]
keywords = ["azure", "finops", "cost-management", "cli", "rich", "cloud-governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
]
dependencies = [
    "azure-identity>=1.17",
    # Transitive via azure-identity/msal, pinned explicitly: 49.0.0 has a known CVE
    # (PYSEC-2026-3552), caught by wiring pip-audit into CI.
    "cryptography>=50.0.0",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-consumption>=10.0",
    "azure-mgmt-subscription>=3.1",
    "azure-mgmt-resourcegraph>=8.0",
    "azure-mgmt-compute>=31.0",
    "azure-mgmt-network>=25.0",
    "rich>=13.7",
    "typer>=0.12",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/Josperdo/azure-finops-dashboard"
Issues = "https://github.com/Josperdo/azure-finops-dashboard/issues"
Changelog = "https://github.com/Josperdo/azure-finops-dashboard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[project.scripts]
azure-finops = "azure_finops_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "azure.mgmt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true
